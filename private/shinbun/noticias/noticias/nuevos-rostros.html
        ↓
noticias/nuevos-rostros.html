<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuevos rostros en la ciudad — YŌRŌ SHINBUN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

:root{
    --bg:#0b0a0b;
    --text:#e8e0d4;
    --muted:#9d958c;
    --line:#494348;
    --red:#7d2029;
    --red-light:#a6424b;
    --gold:#b59a68;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(
            circle at top,
            rgba(125,32,41,.12),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    font-family:"Cormorant Garamond",serif;

    min-height:100vh;
}

body::before{
    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.045;

    background-image:url(
        "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E"
    );

    z-index:999;
}


/* ═══════════════════════════════════════
   HEADER
   ═══════════════════════════════════════ */

.news-header{
    width:100%;

    padding:20px 25px;

    border-bottom:1px solid var(--line);
}

.news-header-inner{
    width:min(1100px,100%);

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.news-header a{
    color:var(--muted);

    text-decoration:none;

    font-family:"Noto Serif JP",serif;

    font-size:.58rem;

    letter-spacing:2.5px;

    transition:color .3s ease;
}

.news-header a:hover{
    color:var(--gold);
}
