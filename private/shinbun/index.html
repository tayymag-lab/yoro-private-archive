<title>YŌRŌ SHINBUN — 夜報</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0b0a0b;
    --text:#e8e0d4;
    --muted:#9d958c;
    --line:#494348;
    --red:#7d2029;
    --red-light:#a6424b;
    --gold:#b59a68;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at top, rgba(125,32,41,.12), transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:"Cormorant Garamond",serif;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.045;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
    z-index:999;
}

/* HEADER */

/* ═══════════════════════════════════════
   YŌRŌ SHINBUN — HEADER
   ═══════════════════════════════════════ */

header{
    width:100%;
    padding:18px 25px 26px;
    text-align:center;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.018),
            transparent 70%
        );

    border-bottom:1px solid var(--line);

    position:relative;
}


/* ───────── TOP NAVIGATION ───────── */

.header-top{
    width:min(1180px,100%);
    margin:0 auto;

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;

    font-family:"Noto Serif JP",serif;
    font-size:.66rem;

    letter-spacing:2.5px;
    color:var(--muted);
}

.header-top a{
    color:var(--muted);
    text-decoration:none;

    transition:
        color .3s ease,
        letter-spacing .3s ease;
}

.header-top a:hover{
    color:var(--gold);
    letter-spacing:3px;
}

.header-link:first-child{
    text-align:left;
}

.header-link:last-child{
    text-align:right;
}

.header-status{
    color:#6f6963;

    font-family:"Noto Serif JP",serif;
    font-size:.58rem;

    letter-spacing:4px;
}


/* ───────── MASTHEAD ───────── */

.masthead{
    margin:43px auto 0;
}

.masthead-jp{
    font-family:"Noto Serif JP",serif;

    color:var(--text);

    font-size:clamp(
        4rem,
        10vw,
        7rem
    );

    font-weight:500;

    letter-spacing:
        clamp(12px,3vw,25px);

    line-height:.9;

    text-shadow:
        0 0 30px rgba(181,154,104,.05);
}


/* ───────── ROMAN NAME ───────── */

.masthead-name{
    margin-top:18px;

    font-family:"Playfair Display",serif;

    color:var(--text);

    font-size:clamp(
        1.7rem,
        4vw,
        3rem
    );

    font-weight:500;

    letter-spacing:
        clamp(7px,1.8vw,13px);

    line-height:1;
}


/* ───────── SUBTITLE ───────── */

.masthead-subtitle{
    margin-top:13px;

    font-family:"Noto Serif JP",serif;

    color:var(--gold);

    font-size:.63rem;

    letter-spacing:4px;

    opacity:.85;
}


/* ───────── DECORATIVE DIVIDER ───────── */

.masthead-divider{
    width:min(720px,80%);
    margin:27px auto 20px;

    display:flex;
    align-items:center;

    gap:15px;
}

.masthead-divider span{
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            var(--line)
        );

    flex:1;
}

.masthead-divider span:last-child{
    background:
        linear-gradient(
            to left,
            transparent,
            var(--line)
        );
}

.masthead-divider b{
    color:var(--gold);

    font-size:.55rem;

    font-weight:400;

    opacity:.8;
}


/* ───────── EDITION INFO ───────── */

.edition-info{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:16px;

    color:#817970;

    font-family:"Noto Serif JP",serif;

    font-size:.58rem;

    letter-spacing:3px;
}

.edition-info i{
    width:3px;
    height:3px;

    border-radius:50%;

    background:var(--red-light);

    opacity:.8;
}


/* ═══════════════════════════════════════
   MOBILE
   ═══════════════════════════════════════ */

@media(max-width:600px){

    header{
        padding:
            15px
            16px
            23px;
    }


    .header-top{
        grid-template-columns:1fr 1fr;

        font-size:.55rem;

        letter-spacing:1.5px;
    }

    .header-status{
        display:none;
    }


    .masthead{
        margin-top:36px;
    }


    .masthead-jp{
        font-size:4rem;

        letter-spacing:10px;
    }


    .masthead-name{
        margin-top:15px;

        font-size:1.55rem;

        letter-spacing:6px;
    }


    .masthead-subtitle{
        margin-top:12px;

        font-size:.53rem;

        letter-spacing:2.5px;
    }


    .masthead-divider{
        width:88%;

        margin-top:25px;

        gap:10px;
    }


    .edition-info{
        gap:8px;

        font-size:.48rem;

        letter-spacing:1.5px;
    }

}
