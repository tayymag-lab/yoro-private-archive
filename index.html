<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YŌRŌ — Private Archive</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #25191a 0%, #0d0b0b 55%, #050505 100%);
    color: #e8dfd2;
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(90deg, transparent 48%, rgba(255,255,255,0.025) 50%, transparent 52%);
    pointer-events: none;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
    animation: appear 2s ease;
}

.symbol {
    font-size: 38px;
    margin-bottom: 20px;
    opacity: 0.9;
}

h1 {
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 12px;
    margin-left: 12px;
}

.subtitle {
    margin-top: 8px;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    letter-spacing: 5px;
    opacity: 0.65;
}

.line {
    width: 130px;
    height: 1px;
    background: #8f6b55;
    margin: 28px auto;
    opacity: 0.7;
}

.jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    letter-spacing: 5px;
    opacity: 0.7;
}

button {
    margin-top: 35px;
    padding: 13px 42px;
    background: transparent;
    border: 1px solid #806052;
    color: #e8dfd2;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.4s ease;
}

button:hover {
    background: #806052;
    color: #0b0909;
}

#access {
    display: none;
    margin-top: 30px;
}

input {
    width: 210px;
    padding: 12px;
    background: transparent;
    border: none;
    border-bottom: 1px solid #806052;
    outline: none;
    color: #e8dfd2;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    letter-spacing: 4px;
}

.error {
    margin-top: 12px;
    color: #9e6c65;
    font-size: 14px;
    display: none;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="symbol">🏮</div>

    <h1>YŌRŌ</h1>

    <div class="subtitle">
        PRIVATE ARCHIVE
    </div>

    <div class="line"></div>

    <div class="jp">
        ようこそ
    </div>

    <button onclick="showAccess()">
        ENTRAR
    </button>

    <div id="access">

        <input
            type="password"
            id="code"
            placeholder="ACCESS CODE"
        >

        <br>

        <button onclick="checkCode()">
            ACCEDER
        </button>

        <div class="error" id="error">
            Código incorrecto.
        </div>

    </div>

</div>

<script>

function showAccess() {
    document.getElementById("access").style.display = "block";
}

function checkCode() {

    const code = document.getElementById("code").value;

    /*
       CAMBIAR ESTE CÓDIGO
       por el código que quieras utilizar.
    */

    const accessCode = "YORO2026";

    if (code === accessCode) {

        window.location.href = "archive.html";

    } else {

        document.getElementById("error").style.display = "block";

    }
}

</script>

</body>
</html>
